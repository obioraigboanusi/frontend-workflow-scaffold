commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: '*.{js,jsx,ts,tsx}'
      run: npx eslint {staged_files}

    - name: prettier
      glob: '*.{js,jsx,ts,tsx,json,css,md,yml,yaml}'
      run: npx prettier --check {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: Format
      run: npm run format:check

    - name: Lint
      run: npm run lint

    - name: Type Check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run Test Suite
      run: npm run test:ci
